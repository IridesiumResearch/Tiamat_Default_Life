# Tiamat Default Life — health, hunger, air, warmth, and what ends them.
#
# The survival layer for Tiamat: hearts and cookies, bubbles when you are
# under, a thermometer only when it matters, food that heals and clothing
# that keeps you warm; the world's modes and admins; and its creatures.
id = "tiamat_default_life"
name = "Tiamat Default Life"
version = "0.1.0"
depends = ["core >=0.1"]
# Loaded AFTER both of these when they are here, which is what the
# optional edge buys:
#
# - The world, whose blocks this mod looks up by name at load (magma, grass,
#   snow, brambles, the trees crows perch in; config.lua). Without the edge
#   the engine's alphabetical tiebreak loads Life first, every one of those
#   lookups finds nothing, and lava does not burn.
# - The interface: the wardrobe is a tab on its inventory screen and the
#   death screen is built from its widgets (screens.lua). Without it, plain
#   dialogs.
optional_depends = ["tiamat_default_world", "tiamat_default_ui"]
description = "Health, hunger, air and body temperature for players, and everything that lives in the world."
license = "GPL-3.0-only"

# NO `[theme]` HERE, ON PURPOSE. The engine wears the LAST theme in load
# order, and this mod loads after the inventory mod that owns the look; a
# theme declared here would replace the whole interface's. This mod's share
# of the screen is its HUD and its `reserve` (init.lua), and nothing else.

# Chosen on the new-world screen and fixed for the life of the world.
[[world_option]]
id = "mode"
name = "Mode"
description = "Default is survival. Creative: nobody can be hurt and nothing drains. Adventure: one life."
options = ["Default", "Creative", "Adventure"]
default = 1
