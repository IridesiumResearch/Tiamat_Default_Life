#
# A native check that runs the mod through the engine's real script VM with a
# fake server around it: a player body, an inventory, blocks and fluid where
# the test puts them. Run from the repository root, with the engine checkout
# beside it as ../Tiamat:
#
#     cargo run --manifest-path tests/native/Cargo.toml
[package]
name = "life-native-check"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
tiamat-core = { path = "../../../Tiamot/crates/core" }
